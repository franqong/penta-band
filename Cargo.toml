[workspace]
members = [
    "crates/penta-band-audio",
    "crates/penta-band-core",
    "crates/penta-band-desktop",
    "crates/penta-band-markup",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
cpal = "0.16"
libc = "=0.2.172"
midir = "0.10"
pulldown-cmark = "0.13"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
